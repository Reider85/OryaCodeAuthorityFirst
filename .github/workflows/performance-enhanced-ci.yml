name: Performance Enhanced CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet all packages
        run: go vet ./...

  test:
    name: test + coverage ≥80%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Включает 5-state teatest snapshots, focus-visibility, alt-text,
      # high-contrast render и budget-тесты (INV-PROMPT-MVP-006..010).
      - name: Unit + contract + TUI snapshot tests
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Enforce NFR-MAINT-01 coverage floor (80%)
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="${total}" 'BEGIN { exit !(t >= 80) }'

  benchmark:
    name: perf budgets (§6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # BenchmarkStateTransition проверяет бюджет ≤100ms (INV-PROMPT-MVP-009);
      # budget-тесты уже утверждают first_paint ≤100ms, frame ≤16ms, keystroke ≤50ms.
      - name: Run UI benchmarks
        run: go test ./pkg/ui/... -run=^$ -bench=. -benchtime=10x -benchmem

  performance-gate:
    name: performance gate
    runs-on: ubuntu-latest
    needs: [vet, test, benchmark]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build performance test binary
        run: |
          go build -o perf-test ./cmd/perf-test
      - name: Run comprehensive performance tests
        run: |
          ./perf-test --comprehensive --threshold=0.1
      - name: Generate performance report
        run: |
          ./perf-test --report --output=performance-report.json
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.json
      - name: Check performance regression
        run: |
          ./perf-test --check-regression --baseline=main
      - name: Performance quality gate
        run: |
          ./perf-test --quality-gate --max-regression=0.15 --min-budget-compliance=0.9

  build:
    name: build single binary
    runs-on: ubuntu-latest
    needs: [vet, test, benchmark, performance-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build with version embedding
        run: |
          # Get version from git
          GIT_VERSION=$(git describe --tags --dirty --always 2>/dev/null || echo "unknown")
          # Build with ldflags
          go build -ldflags="-X 'github.com/Reider85/OryaCodeAuthorityFirst/cmd/caf.version=$GIT_VERSION'" -o caf ./cmd/caf
      - name: Smoke test
        run: ./caf --version
      - name: Performance validation
        run: |
          ./caf --performance-test --threshold=0.1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caf-binary
          path: caf

  performance-trend:
    name: performance trend analysis
    runs-on: ubuntu-latest
    needs: [performance-gate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download performance history
        uses: actions/download-artifact@v4
        with:
          name: performance-report
      - name: Analyze performance trends
        run: |
          go run ./scripts/analyze-performance-trend --input=performance-report.json
      - name: Generate trend report
        run: |
          go run ./scripts/analyze-performance-trend --input=performance-report.json --output=trend-report.json
      - name: Upload trend report
        uses: actions/upload-artifact@v4
        with:
          name: trend-report
          path: trend-report.json
      - name: Check for performance degradation
        run: |
          go run ./scripts/analyze-performance-trend --input=performance-report.json --check-degradation

  performance-alert:
    name: performance alerts
    runs-on: ubuntu-latest
    needs: [performance-gate, performance-trend]
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download performance reports
        uses: actions/download-artifact@v4
        with:
          name: performance-report
      - name: Download trend reports
        uses: actions/download-artifact@v4
        with:
          name: trend-report
      - name: Generate alert message
        run: |
          echo "Performance regression detected!" > alert.txt
          echo "Check the performance reports for details." >> alert.txt
      - name: Create issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const alertMessage = fs.readFileSync('alert.txt', 'utf8');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Performance Regression Detected',
              body: alertMessage,
              labels: ['performance', 'regression', 'ci-failure']
            });
      - name: Send alert (Slack)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: 'Performance regression detected in CI!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  performance-dashboard:
    name: performance dashboard
    runs-on: ubuntu-latest
    needs: [performance-gate, performance-trend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download performance reports
        uses: actions/download-artifact@v4
        with:
          name: performance-report
      - name: Download trend reports
        uses: actions/download-artifact@v4
        with:
          name: trend-report
      - name: Generate performance dashboard
        run: |
          go run ./scripts/generate-dashboard --input=performance-report.json --output=dashboard.html
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: performance-dashboard
          path: dashboard.html
      - name: Deploy dashboard
        run: |
          # Deploy to GitHub Pages or other hosting
          echo "Dashboard generated and uploaded"
