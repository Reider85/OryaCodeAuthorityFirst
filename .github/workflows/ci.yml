name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  RUNNER_THRESHOLD: "80"
  RUNNER_TYPE: "hybrid"

jobs:
  select-runner:
    name: Select Runner Type
    runs-on: ubuntu-latest
    outputs:
      runner-type: ${{ steps.select.outputs.runner-type }}
      runner-label: ${{ steps.select.outputs.runner-label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Runner Type
        id: select
        run: |
          if [[ "${{ env.RUNNER_TYPE }}" == "hybrid" ]]; then
            # Use the runner selection utility
            echo "🔍 Using hybrid runner selection..."
            echo "::set-output name=runner-type::$(bash ./scripts/select-runner.sh ${{ env.RUNNER_THRESHOLD }} hybrid)"
            echo "::set-output name=runner-label::$(bash ./scripts/select-runner.sh ${{ env.RUNNER_THRESHOLD }} hybrid | cut -d'=' -f2)"
          else
            echo "::set-output name=runner-type::${{ env.RUNNER_TYPE }}"
            echo "::set-output name=runner-label::${{ env.RUNNER_TYPE }}"
          fi

  vet:
    name: go vet
    runs-on: ${{ needs.select-runner.outputs.runner-label }}
    needs: select-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet all packages
        run: go vet ./...

  test:
    name: test + coverage ≥80%
    runs-on: ${{ needs.select-runner.outputs.runner-label }}
    needs: [select-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Включает 5-state teatest snapshots, focus-visibility, alt-text,
      # high-contrast render и budget-тесты (INV-PROMPT-MVP-006..010).
      - name: Unit + contract + TUI snapshot tests
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Enforce NFR-MAINT-01 coverage floor (80%)
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="${total}" 'BEGIN { exit !(t >= 80) }'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: perf budgets (§6)
    runs-on: ${{ needs.select-runner.outputs.runner-label }}
    needs: [select-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # BenchmarkStateTransition проверяет бюджет ≤100ms (INV-PROMPT-MVP-009);
      # budget-тесты уже утверждают first_paint ≤100ms, frame ≤16ms, keystroke ≤50ms.
      - name: Run UI benchmarks
        run: go test ./pkg/ui/... -run=^$ -bench=. -benchtime=10x -benchmem

   build:
    name: build single binary
    runs-on: ${{ needs.select-runner.outputs.runner-label }}
    needs: [select-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build with version embedding
        run: |
          # Get version from git
          GIT_VERSION=$(git describe --tags --dirty --always 2>/dev/null || echo "unknown")
          # Build with ldflags
          go build -ldflags="-X 'github.com/Reider85/OryaCodeAuthorityFirst/cmd/caf.version=$GIT_VERSION'" -o caf ./cmd/caf
      - name: Smoke test
        run: ./caf --version

  build-matrix:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [select-runner]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, runner: ${{ needs.select-runner.outputs.runner-label }} }
          - { os: linux,   arch: arm64, runner: ${{ needs.select-runner.outputs.runner-label }} }
          - { os: darwin,  arch: amd64, runner: ${{ needs.select-runner.outputs.runner-label }} }
          - { os: darwin,  arch: arm64, runner: ${{ needs.select-runner.outputs.runner-label }} }
          - { os: windows, arch: amd64, runner: ${{ needs.select-runner.outputs.runner-label }} }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-X 'github.com/Reider85/OryaCodeAuthorityFirst/cmd/caf.version=${{ github.sha }}'" -o caf${{ matrix.os == 'windows' && '.exe' || '' }} ./cmd/caf
      - name: Smoke test
        run: |
          ./caf${{ matrix.os == 'windows' && '.exe' || '' }} --version
