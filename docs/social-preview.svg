<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1280" height="640" fill="#0d1117"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#gradient)"/>
  
  <!-- Title -->
  <text x="640" y="200" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="#f0f6fc">
    CodeAuthorityFirst
  </text>
  
  <!-- Subtitle -->
  <text x="640" y="280" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#8b949e">
    Track who wrote what, when, and why
  </text>
  
  <!-- Description -->
  <text x="640" y="340" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#8b949e">
    AI coding session provenance recorder
  </text>
  
  <!-- Small caf icon placeholder -->
  <circle cx="100" cy="100" r="30" fill="#58a6ff" opacity="0.8"/>
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#0d1117">
    caf
  </text>
  
  <!-- Decorative elements -->
  <circle cx="1180" cy="540" r="40" fill="#a371f7" opacity="0.3"/>
  <circle cx="1150" cy="500" r="20" fill="#58a6ff" opacity="0.4"/>
  <circle cx="1210" cy="520" r="15" fill="#7ee787" opacity="0.4"/>
  
  <!-- Bottom text -->
  <text x="640" y="480" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#8b949e">
    Single binary • Offline • LLM-free • Fail-safe hooks
  </text>
  
  <!-- Version -->
  <text x="640" y="520" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#8b949e">
    MVP 0.4.1
  </text>
</svg>