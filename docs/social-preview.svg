<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1280" height="640" fill="#0d1117"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#grad1)"/>
  
  <!-- Main title -->
  <text x="640" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#f0f6fc">
    CodeAuthorityFirst
  </text>
  
  <!-- Subtitle -->
  <text x="640" y="240" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#7d8590">
    who wrote what, when, and why in AI coding sessions
  </text>
  
  <!-- Caf icon placeholder -->
  <circle cx="120" cy="120" r="40" fill="#58a6ff" opacity="0.8"/>
  <text x="120" y="130" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">
    caf
  </text>
  
  <!-- Decorative elements -->
  <circle cx="1000" cy="500" r="80" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="1100" cy="450" r="60" fill="#58a6ff" opacity="0.15"/>
  <circle cx="1050" cy="550" r="40" fill="#3b82f6" opacity="0.1"/>
  
  <!-- Bottom info -->
  <text x="640" y="380" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#7d8590">
    Single-binary Go tool for AI coding provenance
  </text>
  
  <!-- Version badge -->
  <rect x="520" y="420" width="240" height="40" rx="20" fill="#238636" opacity="0.8"/>
  <text x="640" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Go 1.27 • Single Binary
  </text>
