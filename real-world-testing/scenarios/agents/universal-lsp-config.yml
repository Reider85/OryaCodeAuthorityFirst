## Installation and Setup

### 1. Install gopls
```bash
# Install gopls using go install
go install golang.org/x/tools/gopls@latest

# Verify installation
gopls version

# Add to PATH if necessary
echo 'export PATH=$PATH:$HOME/go/bin' >> ~/.bashrc
source ~/.bashrc
```

### 2. Configure CodeAuthorityFirst
```bash
# Initialize caf in your repository
caf init --auto-detect

# Verify LSP detection
caf adapters list

# Configure LSP adapter
caf init --adapters universal-lsp
```

### 3. Verify Configuration
```bash
# Check caf health
caf doctor

# List adapters
caf adapters list

# Test LSP functionality
caf lsp test
```

