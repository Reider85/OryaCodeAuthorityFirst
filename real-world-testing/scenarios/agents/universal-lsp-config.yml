## Troubleshooting

### Common Issues

#### 1. LSP Not Starting
**Issue**: gopls is not starting or responding
**Solution**: 
```bash
# Check gopls installation
gopls version

# Verify PATH configuration
echo $PATH

# Test gopls manually
gopls serve -rpc.address=localhost:4389
```

#### 2. Symbol Generation Issues
**Issue**: Symbols are not being generated correctly
**Solution**:
```bash
# Check LSP configuration
cat ~/.caf/config.yml

# Verify gopls availability
which gopls

# Test symbol generation manually
gopls ls -remote
```

#### 3. Performance Issues
**Issue**: Slow symbol generation or high memory usage
**Solution**:
```bash
# Check system resources
top

# Monitor LSP performance
caf lsp performance

# Optimize configuration
echo "lsp.max_memory: 52428800" >> ~/.caf/config.yml
```

### Debug Commands
```bash
# Enable debug logging
export CAF_LOG_LEVEL=debug

# Check LSP status
caf lsp status --verbose

# Monitor symbol generation
CAF_LOG_LEVEL=debug caf lsp generate-symbols

# Validate configuration
caf config validate
```

