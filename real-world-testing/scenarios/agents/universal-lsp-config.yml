## Advanced Features

### 1. Symbol Caching
```bash
# Enable symbol caching
echo "lsp.symbol_cache: true" >> ~/.caf/config.yml

# Test cached symbol generation
caf lsp generate-symbols --cached

# Clear cache
caf lsp cache clear
```

### 2. File Watching
```bash
# Enable file watching
echo "lsp.file_watching: true" >> ~/.caf/config.yml

# Test file watching
caf lsp watch

# Stop file watching
caf lsp watch --stop
```

### 3. Lazy Loading
```bash
# Enable lazy loading
echo "lsp.lazy_loading: true" >> ~/.caf/config.yml

# Test lazy loading
caf lsp lazy-load

# Disable lazy loading
echo "lsp.lazy_loading: false" >> ~/.caf/config.yml
```

