# Universal LSP Configuration
**Tier 4 Fallback Adapter Configuration**

---

## Configuration Overview

This file contains the configuration for Universal LSP integration with CodeAuthorityFirst.

### Basic Configuration
```yaml
# universal-lsp-config.yml
caf:
  session_tracking: true
  performance_monitoring: true
  auto_detect: true
  fallback_mode: true

lsp:
  enabled: true
  binary: "gopls"
  timeout: 10000
  retry_count: 3
  retry_delay: 1000
  max_memory: 104857600
  sync_interval: 1800
  lazy_loading: true
  symbol_cache: true
  file_watching: true
  error_handling: graceful

performance:
  startup_timeout: 2000
  sync_timeout: 10000
  client_timeout: 5000
  memory_limit: 100000000
  cpu_limit: 80
  concurrent_requests: 5
```

---

## Configuration Parameters

### Global Settings
- **session_tracking**: Enable/disable session tracking (default: true)
- **performance_monitoring**: Enable/disable performance monitoring (default: true)
- **auto_detect**: Enable/disable automatic agent detection (default: true)
- **fallback_mode**: Enable/disable fallback mode (default: true)

### LSP Configuration
- **enabled**: Enable/disable LSP functionality (default: true)
- **binary**: Path to LSP binary (default: "gopls")
- **timeout**: Request timeout in milliseconds (default: 10000)
- **retry_count**: Number of retry attempts (default: 3)
- **retry_delay**: Delay between retries in milliseconds (default: 1000)
- **max_memory**: Maximum memory usage in bytes (default: 100MB)
- **sync_interval**: Symbol synchronization interval in seconds (default: 1800)
- **lazy_loading**: Enable/disable lazy loading (default: true)
- **symbol_cache**: Enable/disable symbol caching (default: true)
- **file_watching**: Enable/disable file watching (default: true)
- **error_handling**: Error handling mode (graceful/strict, default: graceful)

### Performance Configuration
- **startup_timeout**: LSP startup timeout in milliseconds (default: 2000)
- **sync_timeout**: Symbol synchronization timeout in milliseconds (default: 10000)
- **client_timeout**: Client operation timeout in milliseconds (default: 5000)
- **memory_limit**: Memory limit in bytes (default: 100MB)
- **cpu_limit**: CPU usage limit in percentage (default: 80)
- **concurrent_requests**: Maximum concurrent requests (default: 5)

