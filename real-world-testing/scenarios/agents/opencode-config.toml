# opencode Configuration
**Tier 1 Native Adapter Configuration**

---

## Configuration Overview

This file contains the configuration for opencode integration with CodeAuthorityFirst.

### Basic Configuration
```toml
# hooks.toml - opencode configuration
[[hooks]]
event = "pre-session"
command = "caf hook pre-session"

[[hooks]]
event = "post-edit"
command = "caf hook post-edit"

[[hooks]]
event = "pre-commit"
command = "caf hook pre-commit"
```

### Advanced Configuration
```toml
# hooks.toml - advanced opencode configuration
[caf]
session_tracking = true
performance_monitoring = true
auto_detect = true

[[hooks]]
event = "pre-session"
command = "caf hook pre-session --session {{session_id}}"
working_directory = "{{workspace_root}}"
env = {"CAF_CONFIG" = "{{config_path}}"}

[[hooks]]
event = "post-edit"
command = "caf hook post-edit --session {{session_id}} --files \"{{files_changed}}\" --message \"{{edit_message}}\""
working_directory = "{{workspace_root}}"
env = {"CAF_CONFIG" = "{{config_path}}"}

[[hooks]]
event = "pre-commit"
command = "caf hook pre-commit --session {{session_id}} --repo \"{{workspace_root}}\""
working_directory = "{{workspace_root}}"
env = {"CAF_CONFIG" = "{{config_path}}"}
```

---

## Configuration Parameters

### Global Settings
- **session_tracking**: Enable/disable session tracking (default: true)
- **performance_monitoring**: Enable/disable performance monitoring (default: true)
- **auto_detect**: Enable/disable automatic agent detection (default: true)
- **config_path**: Path to caf configuration file (default: ~/.caf/config.yml)

### Hook Configuration
- **event**: Hook event type (pre-session, post-edit, pre-commit)
- **command**: Command to execute for the hook
- **working_directory**: Working directory for hook execution
- **env**: Environment variables to set for hook execution

### Session Parameters
- **session_id**: Unique identifier for the session
- **files_changed**: List of files changed in the session
- **edit_message**: Message describing the edit
- **workspace_root**: Root directory of the workspace

