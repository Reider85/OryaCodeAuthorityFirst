## Troubleshooting

### Common Issues

#### 1. Hook Not Firing
**Issue**: opencode hooks are not executing
**Solution**: 
```bash
# Check hook configuration
cat ~/.config/opencode/hooks.toml

# Verify caf binary location
which caf

# Test hook execution manually
caf hook pre-session --test
```

#### 2. Session Not Tracked
**Issue**: Sessions are not being tracked
**Solution**:
```bash
# Check caf configuration
cat ~/.caf/config.yml

# Verify adapter detection
caf adapters list

# Check session directory
ls -la ~/.caf/sessions/
```

#### 3. Performance Issues
**Issue**: Slow hook execution or session tracking
**Solution**:
```bash
# Check system resources
top

# Monitor performance
caf doctor --performance

# Optimize configuration
echo "performance_monitoring: false" >> ~/.caf/config.yml
```

### Debug Commands
```bash
# Enable debug logging
export CAF_LOG_LEVEL=debug

# Check hook execution details
caf hook pre-session --verbose

# Monitor session creation
CAF_LOG_LEVEL=debug caf dashboard

# Validate configuration
caf config validate
```

