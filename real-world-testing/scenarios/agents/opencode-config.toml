## Testing Scenarios

### 1. Basic Session Testing
```bash
# Create a test repository
mkdir test-repo && cd test-repo
git init
caf init --auto-detect

# Make changes with opencode
echo "// Test feature" > main.go
git add .
git commit -m "Add test feature"

# Verify session tracking
caf who main.go
```

### 2. Multi-File Testing
```bash
# Create multiple files
echo "package main" > main.go
echo "func main() { println(\"Hello\") }" > main.go
echo "package utils" > utils.go
echo "func Helper() { println(\"Helper\") }" > utils.go

# Make changes with opencode
opencode edit main.go --add "import \"./utils\""
opencode edit utils.go --add "func Helper() { println(\"Updated Helper\") }"

# Verify session tracking
caf who main.go
caf who utils.go
```

### 3. Performance Testing
```bash
# Create a large file for testing
for i in {1..1000}; do
    echo "func function$i() { println(\"Function $i\") }" >> large_file.go
done

# Make changes with opencode
opencode edit large_file.go --add "package main"

# Measure performance time
time caf hook pre-commit --repo "$(pwd)"

# Verify performance requirements
caf doctor
```

### 4. Error Handling Testing
```bash
# Test with invalid configuration
mv ~/.config/opencode/hooks.toml ~/.config/opencode/hooks.toml.bak

# Attempt to use opencode
opencode edit main.go --add "// Test"

# Verify error handling
caf doctor

# Restore configuration
mv ~/.config/opencode/hooks.toml.bak ~/.config/opencode/hooks.toml
```

