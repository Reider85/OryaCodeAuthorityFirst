## Installation and Setup

### 1. Install opencode
```bash
# Download and install opencode
curl -L https://github.com/opencode/opencode/releases/latest/download/opencode-$(uname -s)-$(uname -m).tar.gz -o opencode.tar.gz
tar -xzf opencode.tar.gz
sudo mv opencode /usr/local/bin/

# Verify installation
opencode --version
```

### 2. Configure CodeAuthorityFirst
```bash
# Initialize caf in your repository
caf init --auto-detect

# Verify opencode detection
caf adapters list

# Configure opencode hooks
caf init --adapters opencode
```

### 3. Verify Configuration
```bash
# Check caf health
caf doctor

# List adapters
caf adapters list

# Test hook execution
caf hook pre-session --test
```

